<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI UGC — Control Room</title>
<style>
:root{
  --bg:#0a0b0d; --panel:#121417; --panel2:#171a1f; --line:#23272e;
  --fg:#e8eaed; --dim:#8b929c; --faint:#5a616b;
  --acc:#e8833a; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --blue:#4a9eff;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
header{border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:24px;height:52px;background:var(--panel);position:sticky;top:0;z-index:20}
.logo{font-weight:600;letter-spacing:-.01em}.logo b{color:var(--acc)}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:none;border:0;color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
nav button:hover{color:var(--fg);background:var(--panel2)}
nav button.on{color:var(--fg);background:var(--panel2)}
main{padding:20px;max-width:1500px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat .l{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
h2{font-size:15px;font-weight:600;margin:0 0 12px}
.board{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:200px;display:flex;flex-direction:column}
.col.over{border-color:var(--acc);background:#16181c}
.colh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.colh span:first-child{font-size:12px;font-weight:600;text-transform:capitalize}
.colh .c{color:var(--faint);font-size:12px}
.cards{padding:8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:65vh}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:grab}
.card:hover{border-color:#333941}
.card.drag{opacity:.4}
.card .b{font-weight:500;font-size:13px;margin-bottom:5px;line-height:1.25}
.card .m{display:flex;gap:8px;color:var(--faint);font-size:11px}
.score{color:var(--acc);font-weight:600}
.empty{color:var(--faint);font-size:12px;text-align:center;padding:24px 10px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1a1d22}
tr:hover td{background:var(--panel)}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.pill.fatigued{color:var(--acc);border-color:#4a3320}.pill.high_volume{color:var(--blue);border-color:#1d3555}
.pill.dormant,.pill.unqualified{color:var(--faint)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:20px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.agent .r{font-weight:600;margin-bottom:2px}.agent .o{color:var(--faint);font-size:11px;margin-bottom:10px}
.agent .d{color:var(--dim);font-size:12px;margin-bottom:10px;min-height:32px}
.agent .s{display:flex;gap:12px;font-size:12px}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ev{display:grid;grid-template-columns:118px 76px 64px 1fr;gap:10px;padding:8px 12px;border-bottom:1px solid #1a1d22;font-size:12px;align-items:start}
.ev:last-child{border:0}
.ev .t{color:var(--faint)}.ev .r{color:var(--dim)}
.st{font-weight:600;font-size:11px}
.st.DONE{color:var(--ok)}.st.BLOCKED{color:var(--bad)}.st.FLAG,.st.NOTE{color:var(--warn)}
.st.INFO,.st.RESULT,.st.CORRECTION{color:var(--blue)}
.ev .d{color:var(--dim);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.banner{background:#1a1410;border:1px solid #4a3320;border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px;color:#e0c9a8}
.banner b{color:var(--acc)}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 10px;border-radius:6px;font:inherit;font-size:13px;min-width:130px}
input:focus,select:focus{outline:0;border-color:var(--acc)}
button.go{background:var(--acc);border:0;color:#120a04;font-weight:600;padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
button.go:hover{filter:brightness(1.1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a1d22;font-size:13px}
.kv:last-child{border:0}.kv span:first-child{color:var(--dim)}
.hide{display:none}
</style></head><body>
<header>
  <div class="logo">AI UGC <b>Control Room</b></div>
  <nav>
    <button class="on" data-v="pipeline">Pipeline</button>
    <button data-v="brands">Brands</button>
    <button data-v="agents">Agents</button>
    <button data-v="outreach">Outreach</button>
    <button data-v="production">Production</button>
  </nav>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<script>
const STAGES=["prospect","researched","scripted","drafted","contacted","replied","client"];
let D=null,view="pipeline";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=n=>(n===undefined||n===null||n==="")?'<span style="color:var(--faint)">unknown</span>':esc(n);

async function load(){
  const r=await fetch("/api/data");const j=await r.json();
  if(j.error){document.getElementById("app").innerHTML=
    `<div class="banner"><b>${esc(j.error)}</b><br>Fix: <code>${esc(j.fix||"")}</code></div>`;return;}
  D=j;render();
}
async function post(p,b){await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});await load();}

function stats(){const s=D.stats||{};return `<div class="stats">
  ${[["brands","brands tracked"],["researched","researched"],["scripts","scripts"],
     ["scripts_ready","client-ready"],["hooks","hooks mined"]]
    .map(([k,l])=>`<div class="stat"><div class="n mono">${s[k]??0}</div><div class="l">${l}</div></div>`).join("")}
  <div class="stat"><div class="n mono">$${(Number(s.spent_usd)||0).toFixed(2)}</div><div class="l">spent</div></div>
</div>`;}

function pipeline(){
  const counts={};STAGES.forEach(s=>counts[s]=D.brands.filter(b=>b.stage===s).length);
  return stats()+`<h2>Pipeline</h2><div class="board">`+STAGES.map(s=>`
    <div class="col" data-stage="${s}">
      <div class="colh"><span>${s}</span><span class="c mono">${counts[s]}</span></div>
      <div class="cards">${
        counts[s]===0?`<div class="empty">${s==="contacted"||s==="replied"||s==="client"
          ?"none yet":"empty"}</div>`
        :D.brands.filter(b=>b.stage===s).slice(0,40).map(b=>`
        <div class="card" draggable="true" data-slug="${esc(b.slug)}">
          <div class="b">${esc(b.brand)}</div>
          <div class="m"><span class="score mono">${(b.score||0).toFixed(0)}</span>
          <span class="mono">${b.ad_count} ads</span>
          <span class="mono">${q(b.newest_ad_days)}d</span></div>
        </div>`).join("")}</div>
    </div>`).join("")+`</div>`;
}

function brands(){return `<h2>Brands <span style="color:var(--faint);font-weight:400">${D.brands.length}</span></h2>
 <div class="panel" style="padding:0;overflow:auto;max-height:76vh"><table>
 <thead><tr><th>Brand</th><th>Segment</th><th>Stage</th><th style="text-align:right">Score</th>
 <th style="text-align:right">Ads</th><th style="text-align:right">UGC</th><th style="text-align:right">Silent</th></tr></thead>
 <tbody>${D.brands.map(b=>`<tr>
   <td><div style="font-weight:500">${esc(b.brand)}</div>
       <div style="color:var(--faint);font-size:11px">${esc(b.website||"")}</div></td>
   <td><span class="pill ${esc(b.segment)}">${q(b.segment)}</span></td>
   <td style="color:var(--dim)">${esc(b.stage)}${b.stage_manual?' <span style="color:var(--acc)">•</span>':''}</td>
   <td class="mono score" style="text-align:right">${(b.score||0).toFixed(1)}</td>
   <td class="mono" style="text-align:right">${b.ad_count}</td>
   <td class="mono" style="text-align:right">${b.ugc_est}</td>
   <td class="mono" style="text-align:right">${q(b.newest_ad_days)}</td>
 </tr>`).join("")}</tbody></table></div>`;}

function agents(){return `<h2>Agents</h2><div class="grid2">${D.agents.map(a=>`
  <div class="agent"><div class="r">${esc(a.role)}</div><div class="o mono">${esc(a.owns)}</div>
  <div class="d">${esc(a.does)}</div>
  <div class="s"><span class="mono">${a.events} events</span>
  ${a.blocked?`<span class="mono" style="color:var(--bad)">${a.blocked} blocked</span>`:""}</div></div>`).join("")}
  </div><h2>Activity</h2><div class="feed">${
  D.activity.slice().reverse().map(e=>`<div class="ev">
    <span class="t mono">${esc(e.ts)}</span><span class="r">${esc(e.role)}</span>
    <span class="st ${esc(e.state)}">${esc(e.state)}</span>
    <span class="d">${esc(e.detail)}</span></div>`).join("")}</div>`;}

function outreach(){
  const c=D.crm.contacts||{},ev=(D.crm.events||[]).filter(e=>e.type!=="stage");
  const n=Object.keys(c).length;
  return `<h2>Outreach</h2>
  ${n===0?`<div class="banner"><b>No contacts yet — and that is real, not a loading state.</b><br>
   Agent 7 drafted the emails but found no email address it could verify. It refused to guess:
   a guessed address is a spam-trap risk with no lawful basis. Add one below once you have read it
   off a contact page or a filing.</div>`:""}
  <div class="panel"><h2>Add a contact</h2>
   <form onsubmit="event.preventDefault();const f=event.target;
     post('/api/contact',{slug:f.slug.value,email:f.email.value,role:f.role.value,source:f.source.value});f.reset();">
     <select name="slug">${D.brands.slice(0,40).map(b=>`<option value="${esc(b.slug)}">${esc(b.brand)}</option>`).join("")}</select>
     <input name="email" type="email" placeholder="name@company.com" required>
     <input name="role" placeholder="role (e.g. Head of Growth)">
     <input name="source" placeholder="where you read it" required>
     <button class="go">Add</button></form></div>
  ${n?`<div class="panel" style="padding:0;overflow:auto"><table><thead><tr><th>Brand</th><th>Email</th>
   <th>Role</th><th>Source</th><th></th></tr></thead><tbody>
   ${Object.entries(c).map(([slug,v])=>`<tr><td>${esc(slug)}</td><td class="mono">${esc(v.email)}</td>
   <td>${q(v.role)}</td><td style="color:var(--faint)">${q(v.source)}</td>
   <td><button class="go" onclick="post('/api/event',{slug:'${esc(slug)}',kind:'sent',detail:'sent by hand'})">Mark sent</button></td>
   </tr>`).join("")}</tbody></table></div>`:""}
  <h2 style="margin-top:20px">Log</h2><div class="feed">${
   ev.length?ev.slice().reverse().map(e=>`<div class="ev"><span class="t mono">${esc(e.ts)}</span>
   <span class="r">${esc(e.slug)}</span><span class="st DONE">${esc(e.type)}</span>
   <span class="d">${esc(e.detail)}</span></div>`).join("")
   :`<div class="empty">Nothing sent yet.</div>`}</div>`;}

function production(){const p=D.production||{};
  return `<h2>Production</h2>
  ${p.dry_run?`<div class="banner"><b>Dry run.</b> Nothing has been rendered and nothing spent.
   No render account is configured.</div>`:""}
  <div class="panel">${[["Dry run",p.dry_run],["Spent","$"+(Number(p.spent_usd)||0).toFixed(2)],
   ["Renders produced",p.renders_produced],["Retry cap per script",p.attempt_cap_per_script]]
   .map(([k,v])=>`<div class="kv"><span>${k}</span><span class="mono">${q(String(v))}</span></div>`).join("")}</div>
  ${p.warning?`<div class="banner">${esc(p.warning)}</div>`:""}`;}

function render(){
  const v={pipeline,brands,agents,outreach,production}[view];
  document.getElementById("app").innerHTML=v();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="pipeline")wire();
}
function wire(){
  let cur=null;
  document.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("dragstart",e=>{cur=c.dataset.slug;c.classList.add("drag");});
    c.addEventListener("dragend",e=>c.classList.remove("drag"));
  });
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over");});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");
      if(cur)post("/api/stage",{slug:cur,stage:col.dataset.stage});});
  });
}
document.querySelector("nav").addEventListener("click",e=>{
  if(e.target.dataset.v){view=e.target.dataset.v;render();}});
load();
</script></body></html>
